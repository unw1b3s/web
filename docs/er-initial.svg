<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680"><rect width="1060" height="680" fill="#f7f8fa"/><g fill="none" stroke="#6782aa" stroke-width="2"><path d="M185 255 L185 295 L370 320"/><path d="M875 255 L875 295 L680 320"/></g><g font-family="Arial" fill="#202b3c" font-size="13"><rect x="25" y="35" width="310" height="189" rx="7" fill="white" stroke="#bccbdc"/><text x="40" y="60" font-weight="bold" font-size="18">users</text><text x="40" y="88">id INT UNSIGNED PK</text><text x="40" y="112">login VARCHAR(40) UNIQUE</text><text x="40" y="136">password_hash VARCHAR(255)</text><text x="40" y="160">email VARCHAR(254) UNIQUE</text><text x="40" y="184">phone VARCHAR(12)</text><text x="40" y="208">role ENUM(participant,admin)</text><rect x="715" y="35" width="310" height="189" rx="7" fill="white" stroke="#bccbdc"/><text x="730" y="60" font-weight="bold" font-size="18">events</text><text x="730" y="88">id INT UNSIGNED PK</text><text x="730" y="112">title VARCHAR(160)</text><text x="730" y="136">event_date DATETIME</text><text x="730" y="160">location VARCHAR(160)</text><text x="730" y="184">description TEXT</text><text x="730" y="208">theme ENUM(conference,workshop)</text><rect x="370" y="285" width="310" height="237" rx="7" fill="white" stroke="#bccbdc"/><text x="385" y="310" font-weight="bold" font-size="18">applications</text><text x="385" y="338">id INT UNSIGNED PK</text><text x="385" y="362">user_id INT UNSIGNED FK</text><text x="385" y="386">event_id INT UNSIGNED FK</text><text x="385" y="410">status ENUM(new,assigned,completed)</text><text x="385" y="434">payment ENUM(card,invoice)</text><text x="385" y="458">room ENUM(main,small,online)</text><text x="385" y="482">created_at TIMESTAMP</text><text x="385" y="506">UNIQUE(user_id,event_id)</text><text x="30" y="640">users 1 → N applications; events 1 → N applications; users N ↔ M events через applications</text></g></svg>