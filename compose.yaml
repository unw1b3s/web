services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: conferences
      MYSQL_USER: conference
      MYSQL_PASSWORD: local_conference
      MYSQL_ROOT_PASSWORD: local_root
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      retries: 40
volumes:
  mysql_data:
